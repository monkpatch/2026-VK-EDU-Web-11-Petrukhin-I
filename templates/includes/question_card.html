<article class="card question-card mb-3">
  <div class="card-body d-flex gap-3">
    <div class="text-center">
      <img class="avatar" src="https://picsum.photos/80?{{ question.id }}" alt="Avatar" />
      <div class="vote-widget mt-2" data-like-state="none">
        <span class="vote-count">{{ question.rating }}</span>
        <div class="vote-arrows"><button class="btn-up" type="button" {% if not request.user.is_authenticated %}disabled title="Войдите, чтобы голосовать"{% endif %}>▲</button><button class="btn-down" type="button" {% if not request.user.is_authenticated %}disabled title="Войдите, чтобы голосовать"{% endif %}>▼</button></div>
      </div>
    </div>
    <div class="flex-grow-1">
      <h2 class="h4"><a href="{{ question.get_absolute_url }}">{{ question.title }}</a></h2>
      <p class="mb-2">{{ question.text|truncatechars:200 }}</p>
      <div class="d-flex flex-wrap gap-3 small">
        <a href="{{ question.get_absolute_url }}">answer ({{ question.answers_count }})</a>
        <span>Tags:
          {% for tag in question.tags.all %}
            <a href="{% url 'tag' tag.slug %}">{{ tag.name }}</a>
          {% empty %}
            <span>no tags</span>
          {% endfor %}
        </span>
      </div>
    </div>
  </div>
</article>
