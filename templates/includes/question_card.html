{% load static %}
<article class="card question-card mb-3">
  <div class="card-body d-flex gap-3">
    <div class="text-center">
      {% if question.author.profile.avatar %}
        <img class="avatar" src="{{ question.author.profile.avatar.url }}" alt="{{ question.author.username }} avatar" />
      {% else %}
        <img class="avatar" src="{% static 'img/default-avatar.svg' %}" alt="Default avatar" />
      {% endif %}
      <div class="vote-widget mt-2" data-vote-kind="question" data-object-id="{{ question.id }}" data-like-state="{{ question.user_vote|default:'none' }}">
        <span class="vote-count">{{ question.rating }}</span>
        <div class="vote-arrows">
          <button class="btn-up" type="button" {% if not request.user.is_authenticated or question.user_vote == 'up' %}disabled{% endif %} title="{% if not request.user.is_authenticated %}Войдите, чтобы голосовать{% else %}Нравится{% endif %}">▲</button>
          <button class="btn-down" type="button" {% if not request.user.is_authenticated or question.user_vote == 'down' %}disabled{% endif %} title="{% if not request.user.is_authenticated %}Войдите, чтобы голосовать{% else %}Не нравится{% endif %}">▼</button>
        </div>
      </div>
    </div>
    <div class="flex-grow-1">
      <h2 class="h4"><a href="{{ question.get_absolute_url }}">{{ question.title }}</a></h2>
      <p class="mb-2">{{ question.text|truncatechars:200 }}</p>
      <div class="d-flex flex-wrap gap-3 small">
        <a href="{{ question.get_absolute_url }}">answer ({{ question.answers_count }})</a>
        <span>Tags:
          {% for tag in question.tags.all %}
            <a href="{% url 'tag' tag.slug %}">{{ tag.name }}</a>
          {% empty %}
            <span>no tags</span>
          {% endfor %}
        </span>
      </div>
    </div>
  </div>
</article>
