{% extends 'base.html' %}
{% block content %}
<h1 class="h2 page-title">Log In</h1>
<div class="text-danger mb-3">Sorry, wrong password!</div>
<form class="d-grid gap-3" style="max-width: 420px;">
  <div class="row align-items-center g-2"><div class="col-3"><label class="form-label m-0">Login</label></div><div class="col-9"><input class="form-control" value="Enter yor login here"></div></div>
  <div class="row align-items-center g-2"><div class="col-3"><label class="form-label m-0">Password</label></div><div class="col-9"><input class="form-control" type="password" value="********"></div></div>
  <div><button class="btn btn-primary" type="submit">Log in!</button></div>
  <div><a href="{% url 'signup' %}">create new account</a></div>
</form>
{% endblock %}
