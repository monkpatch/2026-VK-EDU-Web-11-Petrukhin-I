{% extends 'base.html' %}
{% block content %}
<article class="card question-card mb-4">
  <div class="card-body d-flex gap-3">
    <div class="text-center">
      <img class="avatar" src="https://picsum.photos/80?{{ question.avatar_seed }}" alt="Avatar" />
      <div class="vote-widget mt-2" data-like-state="up"><span class="vote-count">{{ question.rating }}</span><div class="vote-arrows"><button class="btn-up" type="button">▲</button><button class="btn-down" type="button">▼</button></div></div>
    </div>
    <div class="flex-grow-1">
      <h1 class="h2">{{ question.title }}</h1>
      <p>{{ question.text }}</p>
      <div class="small">Tags:
        {% for tag in question.tags %}
          <a href="{% url 'tag' tag %}">{{ tag }}</a>
        {% endfor %}
      </div>
    </div>
  </div>
</article>

{% for answer in answers %}
<article class="card answer-card mb-3">
  <div class="card-body d-flex gap-3">
    <div class="text-center"><img class="avatar" src="https://picsum.photos/80?{{ answer.avatar_seed }}" alt="Avatar" /><div class="vote-widget mt-2" data-like-state="none"><span class="vote-count">{{ answer.rating }}</span><div class="vote-arrows"><button class="btn-up" type="button">▲</button><button class="btn-down" type="button">▼</button></div></div></div>
    <div class="flex-grow-1"><p>{{ answer.text }}</p><label class="form-check-label"><input class="form-check-input me-1" type="checkbox" {% if answer.is_correct %}checked{% endif %}>Correct!</label></div>
  </div>
</article>
{% endfor %}
<form class="card answer-form"><div class="card-body"><textarea class="form-control mb-2" placeholder="Enter your answer here.."></textarea><button class="btn btn-success" type="submit">Answer</button></div></form>
{% endblock %}
