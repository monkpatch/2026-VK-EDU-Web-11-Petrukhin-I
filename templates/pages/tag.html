{% extends 'base.html' %}
{% block content %}
<div class="d-flex align-items-end mb-3 flex-wrap gap-3">
  <h1 class="h2 m-0">Tag: {{ tag_name }}</h1>
  <a href="{% url 'index' %}" class="link-primary">New Questions</a>
</div>
{% for question in page_obj %}
  {% include 'includes/question_card.html' %}
{% empty %}
  <p class="text-muted">По этому тегу пока нет вопросов.</p>
{% endfor %}
{% include 'includes/paginator.html' %}
{% endblock %}
