{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AskPupkin — {{ page_title }}</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}" />
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" />
  <link rel="stylesheet" href="{% static 'css/main.css' %}" />
</head>
<body>
<header class="border-bottom sticky-top bg-white">
  <nav class="navbar navbar-expand-lg">
    <div class="container gap-3 flex-wrap">
      <a class="logo-link fs-4" href="{% url 'index' %}">AskPupkin</a>
      <form class="d-flex flex-grow-1 header-search">
        <input class="form-control me-2" type="search" placeholder="Search">
        <button class="btn btn-outline-primary" type="submit">Search</button>
      </form>
      {% if auth %}
      <div class="d-flex align-items-center gap-3 flex-wrap header-actions">
        <a class="btn btn-primary" href="{% url 'ask' %}">ASK!</a>
        <div class="d-flex align-items-center gap-2">
          <img class="user-avatar" src="https://picsum.photos/60?14" alt="User avatar">
          <div class="user-links small">
            <div class="fw-semibold">Dr. Pepper</div>
            <a href="{% url 'profile' %}">settings</a> · <a href="{% url 'login' %}">log out</a>
          </div>
        </div>
      </div>
      {% else %}
      <div class="d-flex align-items-center gap-2 flex-wrap header-actions">
        <a class="btn btn-primary" href="{% url 'ask' %}">ASK!</a>
        <a href="{% url 'login' %}">log in</a>
        <a href="{% url 'signup' %}">register</a>
      </div>
      {% endif %}
    </div>
  </nav>
</header>

<main class="site-main py-4">
  <div class="container">
    <div class="row g-4">
      <section class="col-lg-8">
        {% block content %}{% endblock %}
      </section>
      <aside class="col-lg-4 sidebar-column">
        {% include 'includes/sidebar.html' %}
      </aside>
    </div>
  </div>
</main>

<footer class="mt-auto border-top py-3 bg-light"><div class="container text-body-secondary small">AskMe mockup • Web HW2</div></footer>
<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
