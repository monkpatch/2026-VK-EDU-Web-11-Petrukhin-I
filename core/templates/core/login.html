{% extends 'base.html' %}
{% block content %}
<h1 class="h2 page-title">Log In</h1>
<form class="d-grid gap-3" method="post" style="max-width: 420px;">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next_url }}">
  {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
  {% for field in form %}
    <div class="row align-items-center g-2">
      <div class="col-3"><label class="form-label m-0" for="{{ field.id_for_label }}">{{ field.label }}</label></div>
      <div class="col-9">{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>
    </div>
  {% endfor %}
  <div><button class="btn btn-primary" type="submit">Log in!</button></div>
  <div><a href="{% url 'signup' %}">create new account</a></div>
</form>
{% endblock %}
