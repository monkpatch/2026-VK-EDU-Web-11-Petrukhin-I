<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AskMe — Ask question</title>
  <link rel="icon" type="image/svg+xml" href="static/img/favicon.svg" />
  <link rel="stylesheet" href="static/css/bootstrap.min.css" />
  <link rel="stylesheet" href="static/css/main.css" />
</head>
<body>
<header class="border-bottom sticky-top bg-white"><nav class="navbar navbar-expand-lg"><div class="container gap-3 flex-wrap"><a class="logo-link fs-4" href="index.html">AskMe</a><form class="d-flex flex-grow-1 header-search"><input class="form-control me-2" type="search" placeholder="Search questions"><button class="btn btn-outline-primary" type="submit">Search</button></form><div class="d-flex align-items-center gap-2 flex-wrap header-actions"><a class="btn btn-primary" href="ask.html">Ask!</a><a class="btn btn-outline-secondary" href="profile.html">My profile</a></div></div></nav></header>

<main class="site-main py-4">
  <div class="container"><div class="row g-4"><section class="col-lg-8">
    <h1 class="h2 page-title">Ask a question</h1>
    <form class="card ask-form">
      <div class="card-body d-grid gap-3">
        <div>
          <label class="form-label" for="title">Title</label>
          <input id="title" class="form-control" maxlength="120" placeholder="How to configure reverse proxy?" />
          <div class="help-text mt-1">Max 120 characters. Make title specific.</div>
        </div>
        <div>
          <label class="form-label" for="body">Question text</label>
          <textarea id="body" class="form-control" maxlength="3000" placeholder="Describe your problem"></textarea>
          <div class="help-text mt-1">Include expected behavior and actual result.</div>
          <div class="error-text mt-1">Question text is required.</div>
        </div>
        <div>
          <label class="form-label" for="tags">Tags</label>
          <input id="tags" class="form-control" placeholder="django, nginx, deploy" />
          <div class="help-text mt-1">Up to 3 tags, comma separated.</div>
        </div>
        <div><button class="btn btn-success" type="submit">Publish question</button></div>
      </div>
    </form>
  </section>
  <aside class="col-lg-4 sidebar-column"><div class="card sidebar-card"><div class="card-body"><h2 class="h5">Popular tags</h2><div class="d-flex flex-wrap gap-2 mt-3"><span class="badge text-bg-light">python</span><span class="badge text-bg-light">django</span><span class="badge text-bg-light">linux</span></div></div></div><div class="card sidebar-card"><div class="card-body"><h2 class="h5">Best members</h2><ul class="list-unstyled mb-0 d-grid gap-2 mt-3"><li><a href="#">Alice</a></li><li><a href="#">Bob</a></li><li><a href="#">Charlie</a></li></ul></div></div></aside>
  </div></div>
</main>

<footer class="mt-auto border-top py-3 bg-light"><div class="container text-body-secondary small">AskMe mockup • Web HW1</div></footer>
<script src="static/js/bootstrap.bundle.min.js"></script>
<script src="static/js/main.js"></script>
</body>
</html>
