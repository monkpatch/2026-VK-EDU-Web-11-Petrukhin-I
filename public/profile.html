<body>
<header class="border-bottom sticky-top bg-white"><nav class="navbar navbar-expand-lg"><div class="container gap-3 flex-wrap"><a class="logo-link fs-4" href="index.html">AskPupkin</a><form class="d-flex flex-grow-1 header-search"><input class="form-control me-2" type="search" placeholder="Search"><button class="btn btn-outline-primary" type="submit">Search</button></form><div class="d-flex align-items-center gap-3 flex-wrap header-actions"><a class="btn btn-primary" href="ask.html">ASK!</a><div class="d-flex align-items-center gap-2"><img class="user-avatar" src="https://picsum.photos/60?14" alt="User avatar"><div class="user-links small"><div class="fw-semibold">Dr. Pepper</div><a href="profile.html">settings</a> · <a href="login.html">log out</a></div></div></div></div></nav></header>

<main class="site-main py-4">
  <div class="container">
    <div class="row g-4">
      <section class="col-lg-8">
        <h1 class="h2 page-title">Settings: Dr. Pepper</h1>
        <form class="d-grid gap-3" style="max-width: 540px;">
          <div class="row align-items-center g-2"><div class="col-3"><label class="form-label m-0" for="login">Login</label></div><div class="col-9"><input id="login" class="form-control" value="dr_pepper"></div></div>
          <div class="row align-items-center g-2"><div class="col-3"><label class="form-label m-0" for="email">Email</label></div><div class="col-9"><input id="email" class="form-control" value="drpepper@mail.ru"></div></div>
          <div class="row align-items-center g-2"><div class="col-3"><label class="form-label m-0" for="nick">NickName</label></div><div class="col-9"><input id="nick" class="form-control" value="Dr. Perpper"></div></div>

          <div class="row align-items-start g-2 mt-1">
            <div class="col-3"><label class="form-label m-0" for="avatar">Upload avatar</label></div>
            <div class="col-9">
              <img src="https://picsum.photos/150" class="rounded border mb-2" width="120" height="120" alt="avatar preview">
              <input id="avatar" class="form-control" type="file">
            </div>
          </div>

          <div><button class="btn btn-primary" type="submit">Save</button></div>
        </form>
      </section>

      <aside class="col-lg-4 sidebar-column">
        <div class="card sidebar-card"><div class="card-body"><h2 class="h5">Popular Tags</h2><p class="mb-1">perl <span class="text-danger">python</span> TechnoPark</p><p class="mb-1"><span class="text-danger">MySQL</span> <span class="text-success">django</span></p><p class="mb-0">MailRu Voloshin <span class="text-warning">Firefox</span></p></div></div>
        <div class="card sidebar-card"><div class="card-body"><h2 class="h5">Best Members</h2><ul class="list-unstyled mb-0 d-grid gap-2 mt-3"><li><a href="#">Mr. Freeman</a></li><li><a href="#">Dr. House</a></li><li><a href="#">Bender</a></li><li><a href="#">Queen Victoria</a></li><li><a href="#">V. Pupkin</a></li></ul></div></div>
      </aside>
    </div>
  </div>
</main>
